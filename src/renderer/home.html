<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Browser - Home</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-color: #0ea5e9;
      --accent-hover: #0284c7;
      --shield-green: #10b981;
      --shield-bg: rgba(16, 185, 129, 0.1);
      --border-color: rgba(255, 255, 255, 0.08);
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --shield-green: #059669;
      --shield-bg: rgba(5, 150, 105, 0.1);
      --border-color: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .container {
      max-width: 580px;
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .shield-icon-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: var(--shield-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--shield-green);
    }

    .shield-icon-wrapper svg {
      width: 44px;
      height: 44px;
      fill: currentColor;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-sub);
      line-height: 1.5;
    }

    .primary-btn {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      margin-top: 8px;
    }

    .primary-btn:hover {
      background-color: var(--accent-hover);
    }

    .primary-btn:active {
      transform: scale(0.98);
    }

    .secondary-info {
      font-size: 12.5px;
      color: var(--text-sub);
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 8px;
      line-height: 1.4;
      max-width: 460px;
      margin-top: 10px;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      margin-top: 12px;
      text-align: left;
    }

    .feature-card {
      background-color: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      padding: 12px 14px;
      border-radius: 10px;
    }

    .feature-card-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--shield-green);
      margin-bottom: 4px;
    }

    .feature-card-desc {
      font-size: 11.5px;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="shield-icon-wrapper">
      <svg viewBox="0 0 24 24">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8s0 0 0 0z"/>
      </svg>
    </div>

    <h1>Private Browser</h1>
    <p class="subtitle">Browse without keeping a permanent local browsing history.</p>

    <button class="primary-btn" id="start-browsing-btn">Start Browsing</button>

    <div class="features-grid">
      <div class="feature-card">
        <div class="feature-card-title">Temporary Session</div>
        <div class="feature-card-desc">Isolated in-memory partition for browsing state.</div>
      </div>
      <div class="feature-card">
        <div class="feature-card-title">Auto Purge</div>
        <div class="feature-card-desc">Cookies, storage, and cache deleted on exit.</div>
      </div>
    </div>

    <div class="secondary-info">
      Your browsing session is temporary. Local session data is removed when the browser closes.
    </div>
  </div>

  <script>
    // Listen for theme sync if necessary
    window.addEventListener('message', (event) => {
      if (event.data && event.data.theme) {
        document.documentElement.setAttribute('data-theme', event.data.theme);
      }
    });

    document.getElementById('start-browsing-btn').addEventListener('click', () => {
      window.parent.postMessage({ type: 'START_BROWSING' }, '*');
    });
  </script>
</body>
</html>
